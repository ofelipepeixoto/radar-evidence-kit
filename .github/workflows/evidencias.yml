name: Contratos e recibos de evidência
on: [push, pull_request]
permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Instalar somente o núcleo autoral
        run: python -m pip install --no-deps .
      - name: Verificar contratos e recibos sem motor opcional
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -c "import radar_evidence, sys; assert 'semantica' not in sys.modules"
          python -m unittest discover -s tests -v

  semantica_optional:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: semantica-agi/semantica
          ref: a1a8404e20bc146b481dad65cbe5dcccddae84ab
          path: semantica-upstream
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Instalar núcleo e dependências mínimas testadas do adapter
        run: |
          python -m pip install --no-deps .
          python -m pip install --only-binary=:all: --no-deps -r optional/requirements.txt
          python -m pip check
      - name: Regras reais fixas sem modelos ou serviços
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: semantica-upstream
          RADAR_SEMANTICA_INTEGRATION: "1"
          SEMANTICA_DISABLE_JUPYTER_PROGRESS: "1"
        run: |
          python optional/verify_minimal_imports.py
          python -m unittest discover -s tests -v
