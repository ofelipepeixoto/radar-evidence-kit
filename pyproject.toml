[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radar-evidence-kit"
version = "0.1.0"
description = "Original offline evidence contracts, receipts and optional symbolic citation checks"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Carlos Felipe"}]
license = {text = "MIT"}
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
